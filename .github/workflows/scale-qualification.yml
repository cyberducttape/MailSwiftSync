name: Large mailbox scale qualification

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 1 * *"

permissions:
  contents: read

jobs:
  scale-100k-message-mailbox:
    name: Packaged imapsync with 100k-message mailbox
    runs-on: ubuntu-24.04
    # The real 100k fixture runs both a full migration and a later incremental
    # pass. The host watchdog bounds container wait independently of command
    # timeouts; an outer timeout on that helper is a final workflow-level guard.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the distributed runtime image
        run: docker build --build-arg MAILSWIFTSYNC_GIT_SHA="${GITHUB_SHA}" --tag mailswiftsync:scale .
      - name: Run single-mailbox 100k-message transfer and verification
        run: |
          mkdir -p provider-scale-evidence
          chmod 0700 provider-scale-evidence
          sudo chown 10001:10001 provider-scale-evidence
          container_name="mailswiftsync-scale-${GITHUB_RUN_ID}"
          stats_file="$RUNNER_TEMP/docker-memory-${GITHUB_RUN_ID}.txt"
          summary_file="$RUNNER_TEMP/scale-resource-summary-${GITHUB_RUN_ID}.txt"
          wait_output_file="$RUNNER_TEMP/docker-wait-${GITHUB_RUN_ID}.txt"
          watchdog_marker="$RUNNER_TEMP/scale-watchdog-${GITHUB_RUN_ID}.txt"
          # The integration harness starts disposable Dovecot processes. Use
          # Docker's init shim as PID 1 so orphaned fixture children are
          # reaped and the container exits as soon as the harness shell exits.
          docker run --detach --init --name "$container_name" \
            --user 0:0 \
            --volume "$PWD/provider-scale-evidence:/provider-evidence" \
            --env MAILSWIFTSYNC_EVIDENCE_OUTPUT=/provider-evidence \
            --env MAILSWIFTSYNC_SCALE_MESSAGES=100000 \
            --env MAILSWIFTSYNC_DISPOSABLE_SCALE=1 \
            --entrypoint /bin/bash mailswiftsync:scale \
            /usr/local/lib/mailswiftsync/imap-integration-smoke.sh
          started_at="$(date +%s)"
          docker stats --format '{{.MemUsage}}' "$container_name" > "$stats_file" &
          stats_pid=$!
          container_status="$(bash scripts/scale-container-wait.sh \
            "$container_name" "$wait_output_file" "$watchdog_marker" 3600 3800)"
          finished_at="$(date +%s)"
          kill "$stats_pid" 2>/dev/null || true
          wait "$stats_pid" 2>/dev/null || true
          if [ "$container_status" -eq 124 ] || [ "$container_status" -eq 125 ]; then
            timeout --foreground --kill-after=5s 60 docker logs "$container_name" 2>&1 | tail -n 100 || true
          else
            timeout --foreground --kill-after=5s 120 docker logs "$container_name"
          fi
          if [ -f provider-scale-evidence/scale-progress.txt ]; then
            echo 'Scale command progress markers:'
            cat provider-scale-evidence/scale-progress.txt
          fi
          if [ -f "$watchdog_marker" ]; then
            sudo cp "$watchdog_marker" provider-scale-evidence/scale-watchdog.txt
            sudo chown 10001:10001 provider-scale-evidence/scale-watchdog.txt
          fi
          python3 scripts/docker_memory.py "$stats_file" > "$summary_file"
          printf 'wall_clock_seconds=%s\ncontainer_exit_status=%s\n' \
            "$((finished_at - started_at))" "$container_status" >> "$summary_file"
          cat "$summary_file"
          sudo cp "$summary_file" provider-scale-evidence/scale-resource-summary.txt
          sudo chown 10001:10001 provider-scale-evidence/scale-resource-summary.txt
          timeout --foreground --kill-after=5s 20 docker rm "$container_name" >/dev/null
          if [ "$container_status" -ne 0 ]; then
            exit "$container_status"
          fi
      - name: Restore private artifact ownership for upload
        if: always()
        run: |
          if [ -d provider-scale-evidence ]; then
            sudo chown -R "$(id -u):$(id -g)" provider-scale-evidence
            chmod -R u+rwX,go-rwx provider-scale-evidence
          fi
      - name: Upload scale diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 100k-message-imap-scale-evidence
          path: provider-scale-evidence
          if-no-files-found: warn
