name: Large mailbox scale qualification

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Reproducible generic-IMAP qualification fixture
        required: true
        type: choice
        options:
          - 100k-small
          - 10k-1g
        default: 100k-small
  schedule:
    - cron: "41 4 1 * *"

permissions:
  contents: read

jobs:
  scale-100k-message-mailbox:
    name: Packaged imapsync scale scenarios
    runs-on: ubuntu-24.04
    # The real 100k fixture runs both a full migration and a later incremental
    # pass. The host completion-marker deadline is independent of command
    # timeouts; the hosted runner VM owns final disposal of the fixture.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the distributed runtime image
        run: docker build --build-arg MAILSWIFTSYNC_GIT_SHA="${GITHUB_SHA}" --tag mailswiftsync:scale .
      - name: Run selected transfer and verification scenario
        env:
          SCALE_SCENARIO: ${{ github.event.inputs.scenario || '100k-small' }}
        run: |
          scale_messages=100000
          scale_total_body_bytes=0
          if [ "$SCALE_SCENARIO" = '10k-1g' ]; then
            scale_messages=10000
            scale_total_body_bytes=1073741824
          elif [ "$SCALE_SCENARIO" != '100k-small' ]; then
            echo "Unknown scale scenario: $SCALE_SCENARIO" >&2
            exit 2
          fi
          mkdir -p provider-scale-evidence
          chmod 0700 provider-scale-evidence
          sudo chown 10001:10001 provider-scale-evidence
          container_name="mailswiftsync-scale-${GITHUB_RUN_ID}"
          stats_file="$RUNNER_TEMP/docker-memory-${GITHUB_RUN_ID}.txt"
          summary_file="$RUNNER_TEMP/scale-resource-summary-${GITHUB_RUN_ID}.txt"
          watchdog_marker="$RUNNER_TEMP/scale-watchdog-${GITHUB_RUN_ID}.txt"
          # The integration harness starts disposable Dovecot processes. Keep
          # them contained under an init process; do not synchronously wait for
          # Docker to stop a fixture that may be blocked in filesystem I/O.
          docker run --detach --init --name "$container_name" \
            --user 0:0 \
            --volume "$PWD/provider-scale-evidence:/provider-evidence" \
            --env MAILSWIFTSYNC_EVIDENCE_OUTPUT=/provider-evidence \
            --env MAILSWIFTSYNC_SCALE_MESSAGES="$scale_messages" \
            --env MAILSWIFTSYNC_SCALE_TOTAL_BODY_BYTES="$scale_total_body_bytes" \
            --env MAILSWIFTSYNC_DISPOSABLE_SCALE=1 \
            --entrypoint /bin/bash mailswiftsync:scale \
            /usr/local/lib/mailswiftsync/imap-integration-smoke.sh
          started_at="$(date +%s)"
          docker stats --format '{{.MemUsage}}' "$container_name" > "$stats_file" &
          stats_pid=$!
          # The evidence directory is private to the container user, so the
          # runner user cannot see the completion marker without sudo.
          harness_status="$(sudo bash scripts/scale-container-completion-wait.sh \
            "$PWD/provider-scale-evidence/scale-progress.txt" \
            "$watchdog_marker" 3800)"
          finished_at="$(date +%s)"
          kill "$stats_pid" 2>/dev/null || true
          if sudo test -f provider-scale-evidence/scale-progress.txt; then
            echo 'Scale command progress markers:'
            sudo cat provider-scale-evidence/scale-progress.txt
          fi
          if sudo test -f provider-scale-evidence/process-memory-peaks.txt; then
            echo 'Per-process memory attribution:'
            sudo cat provider-scale-evidence/process-memory-peaks.txt
          fi
          if [ -f "$watchdog_marker" ]; then
            sudo cp "$watchdog_marker" provider-scale-evidence/scale-watchdog.txt
            sudo chown 10001:10001 provider-scale-evidence/scale-watchdog.txt
          fi
          python3 scripts/docker_memory.py "$stats_file" > "$summary_file"
          printf 'scenario=%s\nscale_messages=%s\nscale_body_payload_bytes=%s\nwall_clock_seconds=%s\nharness_exit_status=%s\ncontainer_teardown=delegated_to_ephemeral_runner\n' \
            "$SCALE_SCENARIO" "$scale_messages" "$scale_total_body_bytes" \
            "$((finished_at - started_at))" "$harness_status" >> "$summary_file"
          cat "$summary_file"
          sudo cp "$summary_file" provider-scale-evidence/scale-resource-summary.txt
          sudo chown 10001:10001 provider-scale-evidence/scale-resource-summary.txt
          if [ "$harness_status" -ne 0 ]; then
            exit "$harness_status"
          fi
      - name: Restore private artifact ownership for upload
        if: always()
        run: |
          if [ -d provider-scale-evidence ]; then
            sudo chown -R "$(id -u):$(id -g)" provider-scale-evidence
            chmod -R u+rwX,go-rwx provider-scale-evidence
          fi
      - name: Upload scale diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 100k-message-imap-scale-evidence
          path: provider-scale-evidence
          if-no-files-found: warn
