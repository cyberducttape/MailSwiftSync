name: Fleet API DAST

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "11 7 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Authenticated ZAP baseline scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@master # revision locked by actions.lock
        with:
          toolchain: 1.92.0

      - name: Build the fleet API
        run: cargo build --locked --bin mailswiftsync

      - name: Start an isolated fleet API with a temporary token
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          state_dir="$RUNNER_TEMP/fleet-api-dast-state"
          token_file="$RUNNER_TEMP/fleet-api-dast-token"
          operators_file="$RUNNER_TEMP/fleet-api-dast-operators"
          pid_file="$RUNNER_TEMP/fleet-api-dast.pid"
          mkdir -m 700 "$state_dir"
          openssl rand -hex 32 > "$token_file"
          token="$(<"$token_file")"
          operator_token="$(openssl rand -hex 32)"
          printf '%s DAST Operator\n' "$operator_token" > "$operators_file"
          chmod 600 "$operators_file"
          echo "::add-mask::$token"
          echo "::add-mask::$operator_token"
          printf 'FLEET_API_DAST_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          printf 'FLEET_API_DAST_OPERATOR_TOKEN=%s\n' "$operator_token" >> "$GITHUB_ENV"

          target/debug/mailswiftsync serve "$state_dir" \
            --token-file "$token_file" \
            --operators-file "$operators_file" \
            --listen 127.0.0.1:9464 \
            --refresh-seconds 5 \
            > "$RUNNER_TEMP/fleet-api-dast.log" 2>&1 &
          echo "$!" > "$pid_file"

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9464/readyz > /dev/null; then
              curl --fail --silent \
                -H "Authorization: Bearer $token" \
                http://127.0.0.1:9464/v1/fleet > /dev/null
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/fleet-api-dast.log"
          echo "Fleet API did not become ready after $attempt attempts" >&2
          exit 1

      - name: Exercise live reader and operator authorization boundaries
        run: >-
          python3 scripts/fleet-api-auth-smoke.py
          --base-url http://127.0.0.1:9464
          --report "$RUNNER_TEMP/fleet-api-auth-smoke.json"

      - name: Scan the live API with ZAP baseline rules
        uses: zaproxy/action-baseline@v0.15.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ env.FLEET_API_DAST_TOKEN }}
          ZAP_AUTH_HEADER_SITE: 127.0.0.1
        with:
          target: http://127.0.0.1:9464/v1/fleet
          rules_file_name: .zap/rules.tsv
          # Update this digest only with a reviewed ZAP image release.
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6
          fail_action: true
          allow_issue_writing: false
          artifact_name: fleet-api-zap-baseline

      - name: Preserve live authorization matrix
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fleet-api-auth-smoke
          path: ${{ runner.temp }}/fleet-api-auth-smoke.json
          if-no-files-found: warn
          retention-days: 90

      - name: Stop the fleet API
        if: always()
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/fleet-api-dast.pid"
          if [[ -f "$pid_file" ]]; then
            kill "$(<"$pid_file")" 2>/dev/null || true
          fi
