name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: bash -n scripts/*.sh
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked --release --all-features
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit
      - name: Generate and validate SBOM
        run: |
          mkdir -p dist
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)" scripts/generate-sbom.sh dist/mailswiftsync-sbom.json
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)" scripts/generate-sbom.sh dist/mailswiftsync-sbom-repeat.json
          cmp --silent dist/mailswiftsync-sbom.json dist/mailswiftsync-sbom-repeat.json
          rm dist/mailswiftsync-sbom-repeat.json
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' dist/mailswiftsync-sbom.json

  cross-platform-build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          targets: ${{ matrix.target }}
      - name: Compile release target
        run: cargo build --locked --release --all-features --target ${{ matrix.target }}

  native-runtime-tests:
    name: Native runtime tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          components: rustfmt, clippy
      - name: Run native test suite
        run: cargo test --locked --all-targets --all-features

  container-build:
    name: Build headless container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build container image
        run: docker build --tag mailswiftsync:ci .
      - name: Smoke-test container CLI
        run: docker run --rm mailswiftsync:ci --version
      - name: Smoke-test bundled imapsync
        run: docker run --rm --entrypoint imapsync mailswiftsync:ci --version
      - name: Smoke-test bundled Dovecot
        run: docker run --rm --entrypoint doveadm mailswiftsync:ci --version
