name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mailswiftsync-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: bash -n scripts/*.sh
      - run: scripts/verify-compatibility-matrix.sh docs/compatibility-matrix.md
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked --release --all-features
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit
      - name: Generate and validate SBOM
        run: |
          mkdir -p dist
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)" scripts/generate-sbom.sh dist/mailswiftsync-sbom.json
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)" scripts/generate-sbom.sh dist/mailswiftsync-sbom-repeat.json
          cmp --silent dist/mailswiftsync-sbom.json dist/mailswiftsync-sbom-repeat.json
          rm dist/mailswiftsync-sbom-repeat.json
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' dist/mailswiftsync-sbom.json

  cross-platform-build:
    name: Build (${{ matrix.target }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          targets: ${{ matrix.target }}
      - name: Initialize MSVC build environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Select the MSVC linker explicitly
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe'
          if (-not (Test-Path $linker)) { throw "Could not locate the x64 MSVC linker at $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile release target
        shell: bash
        run: |
          set +e
          cargo build --locked --release --all-features --target "${{ matrix.target }}" 2>&1 | tee cross-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && [ "${{ matrix.os }}" = "windows-latest" ]; then
            failures=$(sed -n 's/.*error\[[A-Z0-9]*\]:[[:space:]]*//p' cross-build.log | head -5 | paste -sd '; ' -)
            details=$(grep -E '(^error|FAILED$|panicked at|failed to find tool)' cross-build.log | tail -20 | tr '\r\n' ' ' | cut -c1-5000)
            echo "::error title=Windows cross-build failure::${failures:-cargo build failed; inspect cross-build.log artifact} ${details}"
          fi
          exit "$status"
      - name: Upload cross-platform build log
        if: failure() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: windows-cross-build-log
          path: cross-build.log
          if-no-files-found: error
      - name: Summarize Windows cross-build failure
        if: failure() && matrix.os == 'windows-latest'
        shell: bash
        run: |
          {
            echo '### Windows cross-build failure details'
            echo '```text'
            tail -n 160 cross-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  native-runtime-tests:
    name: Native runtime tests (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          components: rustfmt, clippy
      - name: Initialize MSVC build environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Select the MSVC linker explicitly
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe'
          if (-not (Test-Path $linker)) { throw "Could not locate the x64 MSVC linker at $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run native test suite
        if: matrix.os != 'macos-latest'
        env:
          RUST_BACKTRACE: full
        shell: bash
        run: |
          set +e
          cargo test --locked --all-targets --all-features -- --test-threads=1 --nocapture 2>&1 | tee native-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && [ "${{ matrix.os }}" = "windows-latest" ]; then
            failures=$(sed -n 's/^test \(.*\) \.\.\. FAILED$/\1/p' native-test.log | paste -sd ', ' -)
            details=$(grep -E '(^error|FAILED$|panicked at|failed to find tool)' native-test.log | tail -20 | tr '\r\n' ' ' | cut -c1-5000)
            echo "::error title=Windows native test failure::${failures:-cargo test failed; inspect native-test.log artifact} ${details}"
          fi
          exit "$status"
      - name: Upload Windows native test log
        if: failure() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: windows-native-test-log
          path: native-test.log
          if-no-files-found: error
      - name: Summarize Windows native test failure
        if: failure() && matrix.os == 'windows-latest'
        shell: bash
        run: |
          {
            echo '### Windows native test failure details'
            echo '```text'
            tail -n 160 native-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run macOS core tests
        if: matrix.os == 'macos-latest'
        env:
          RUST_BACKTRACE: full
        run: cargo test --locked --all-targets --all-features core::tests -- --test-threads=1 --nocapture
      - name: Run macOS process tests
        if: matrix.os == 'macos-latest'
        env:
          RUST_BACKTRACE: full
        run: cargo test --locked --all-targets --all-features process::tests -- --test-threads=1 --nocapture
      - name: Run macOS controller tests
        if: matrix.os == 'macos-latest'
        env:
          RUST_BACKTRACE: full
        shell: bash
        run: |
          set +e
          cargo test --locked --all-targets --all-features 'tests::' -- --test-threads=1 --nocapture 2>&1 | tee macos-controller-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            failed_tests=$(sed -n 's/^test \(.*\) \.\.\. FAILED$/\1/p' macos-controller-tests.log | paste -sd ', ' -)
            echo "::error title=macOS controller test failure::${failed_tests:-Cargo test failed; inspect the job log}"
          fi
          exit "$status"

  container-build:
    name: Build headless container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build container image
        run: docker build --tag mailswiftsync:ci .
      - name: Smoke-test container CLI
        run: docker run --rm mailswiftsync:ci --version
      - name: Smoke-test bundled imapsync
        run: docker run --rm --entrypoint imapsync mailswiftsync:ci --version
      - name: Smoke-test bundled Dovecot engine
        run: docker run --rm --entrypoint dovecot mailswiftsync:ci --version
      - name: Smoke-test bundled doveadm
        run: docker run --rm --entrypoint doveadm mailswiftsync:ci pw -s SHA512-CRYPT -p smoke
