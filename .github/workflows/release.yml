name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    name: Release quality gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - name: Verify documentation claims against capability manifest
        run: python3 scripts/verify-capability-claims.py
      - run: bash -n scripts/*.sh
      - run: scripts/verify-release-version.sh "${GITHUB_REF_NAME}"
      - run: scripts/verify-compatibility-matrix.sh --release docs/compatibility-matrix.md
      - name: Install provider evidence validator
        run: python3 -m pip install --disable-pip-version-check --requirement tests/provider-evidence/requirements.txt
      - name: Fetch externally retained provider evidence
        env:
          MAILSWIFTSYNC_RELEASE_EVIDENCE_URL: ${{ vars.MAILSWIFTSYNC_RELEASE_EVIDENCE_URL }}
          MAILSWIFTSYNC_RELEASE_EVIDENCE_SHA256: ${{ vars.MAILSWIFTSYNC_RELEASE_EVIDENCE_SHA256 }}
        run: scripts/fetch-release-evidence.sh "$RUNNER_TEMP/mailswiftsync-release-evidence"
      - name: Verify provider evidence
        env:
          MAILSWIFTSYNC_RELEASE_COMMIT: ${{ github.sha }}
          MAILSWIFTSYNC_EVIDENCE_DIR: ${{ runner.temp }}/mailswiftsync-release-evidence
          MAILSWIFTSYNC_POLICY_FILE: ${{ github.workspace }}/tests/provider-evidence/policy.json
          MAILSWIFTSYNC_SCHEMA_FILE: ${{ github.workspace }}/tests/provider-evidence/schema.json
        run: scripts/verify-evidence-gate.sh --release
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: mailswiftsync
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mailswiftsync.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mailswiftsync
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: mailswiftsync
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          targets: ${{ matrix.target }}
      - name: Build
        env:
          MAILSWIFTSYNC_GIT_SHA: ${{ github.sha }}
        run: cargo build --locked --release --all-features --target ${{ matrix.target }}
      - name: Sign Windows binary with Authenticode
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            throw 'Windows release signing secrets/vars are not configured'
          }
          $cert = Join-Path $env:RUNNER_TEMP 'mailswiftsync-signing.pfx'
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERT_PASSWORD -AsPlainText -Force
          $subject = Join-Path $env:GITHUB_WORKSPACE 'target/${{ matrix.target }}/release/${{ matrix.binary }}'
          & signtool sign /fd SHA256 /f $cert /p $env:WINDOWS_SIGNING_CERT_PASSWORD /tr $env:WINDOWS_TIMESTAMP_URL /td SHA256 $subject
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed' }
          & signtool verify /pa /all $subject
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed' }
          Remove-Item -Force $cert
      - name: Sign macOS binary with Developer ID
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGNING_CERT_BASE64: ${{ secrets.MACOS_SIGNING_CERT_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          : "${MACOS_SIGNING_CERT_BASE64:?MACOS_SIGNING_CERT_BASE64 is not configured}"
          : "${MACOS_SIGNING_CERT_PASSWORD:?MACOS_SIGNING_CERT_PASSWORD is not configured}"
          : "${MACOS_SIGNING_IDENTITY:?MACOS_SIGNING_IDENTITY is not configured}"
          keychain="$RUNNER_TEMP/mailswiftsync-signing.keychain-db"
          cert="$RUNNER_TEMP/mailswiftsync-signing.p12"
          security create-keychain -p "$MACOS_SIGNING_CERT_PASSWORD" "$keychain"
          security unlock-keychain -p "$MACOS_SIGNING_CERT_PASSWORD" "$keychain"
          printf '%s' "$MACOS_SIGNING_CERT_BASE64" | base64 --decode > "$cert"
          security import "$cert" -k "$keychain" -P "$MACOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_SIGNING_CERT_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          codesign --verify --deep --strict --verbose=2 "target/${{ matrix.target }}/release/${{ matrix.binary }}"
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          mkdir -p bundle
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} bundle/mailswiftsync-${{ matrix.target }}
          scripts/stage-release-docs.sh bundle
          chmod 0755 bundle/mailswiftsync-${{ matrix.target }}
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ditto -c -k --keepParent bundle "dist/mailswiftsync-${{ matrix.target }}.zip"
            scripts/verify-release-bundle.sh "dist/mailswiftsync-${{ matrix.target }}.zip"
            (cd dist && shasum -a 256 mailswiftsync-${{ matrix.target }}.zip) > dist/mailswiftsync-${{ matrix.target }}.zip.sha256
          else
            tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner -C bundle -czf dist/mailswiftsync-${{ matrix.target }}.tar.gz .
            scripts/verify-release-bundle.sh dist/mailswiftsync-${{ matrix.target }}.tar.gz
            (cd dist && shasum -a 256 mailswiftsync-${{ matrix.target }}.tar.gz) > dist/mailswiftsync-${{ matrix.target }}.tar.gz.sha256
          fi
      - name: Notarize macOS archive
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?APPLE_ID is not configured}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?APPLE_APP_SPECIFIC_PASSWORD is not configured}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is not configured}"
          xcrun notarytool submit "dist/mailswiftsync-${{ matrix.target }}.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary }} bundle/mailswiftsync-${{ matrix.target }}.exe
          bash scripts/stage-release-docs.sh bundle
          Compress-Archive -Path bundle/* -DestinationPath dist/mailswiftsync-${{ matrix.target }}.zip
          bash scripts/verify-release-bundle.sh dist/mailswiftsync-${{ matrix.target }}.zip
          (Get-FileHash dist/mailswiftsync-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + '  ' + 'mailswiftsync-${{ matrix.target }}.zip' | Out-File dist/mailswiftsync-${{ matrix.target }}.zip.sha256 -Encoding ascii
      - name: Verify Windows signature remains present
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & signtool verify /pa /all "bundle/mailswiftsync-${{ matrix.target }}.exe"
          if ($LASTEXITCODE -ne 0) { throw 'packaged Windows binary is not Authenticode signed' }
      - name: Sign Linux checksum with release GPG key
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_GPG_PRIVATE_KEY_BASE64: ${{ secrets.RELEASE_GPG_PRIVATE_KEY_BASE64 }}
          RELEASE_GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          : "${RELEASE_GPG_PRIVATE_KEY_BASE64:?RELEASE_GPG_PRIVATE_KEY_BASE64 is not configured}"
          : "${RELEASE_GPG_KEY_ID:?RELEASE_GPG_KEY_ID is not configured}"
          archive="dist/mailswiftsync-${{ matrix.target }}.tar.gz"
          scripts/sign-linux-release.sh "$archive"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mailswiftsync-${{ matrix.target }}
          path: dist/*

  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
      - name: Generate Rust dependency SBOM from Cargo.lock
        run: |
          scripts/generate-sbom.sh dist/mailswiftsync-rust-sbom.cdx.json
          (cd dist && sha256sum mailswiftsync-rust-sbom.cdx.json) > dist/mailswiftsync-rust-sbom.cdx.json.sha256
      - name: Build final runtime image for image SBOM
        run: docker build --build-arg MAILSWIFTSYNC_GIT_SHA="${GITHUB_SHA}" --tag mailswiftsync:sbom .
      - name: Generate final image package SBOM
        run: |
          scripts/generate-image-sbom.sh mailswiftsync:sbom dist/mailswiftsync-image-sbom.spdx.json
          (cd dist && sha256sum mailswiftsync-image-sbom.spdx.json) > dist/mailswiftsync-image-sbom.spdx.json.sha256
      - name: Attest Rust SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mailswiftsync-rust-sbom.cdx.json
      - name: Attest image SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mailswiftsync-image-sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mailswiftsync-sbom
          path: dist/mailswiftsync-*-sbom.*

  packaged-integration:
    name: Packaged Dovecot + imapsync integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build distributed runtime image
        run: docker build --build-arg MAILSWIFTSYNC_GIT_SHA="${GITHUB_SHA}" --tag mailswiftsync:release-integration .
      - name: Run packaged IMAP transfer fixture
        run: docker run --rm --entrypoint /bin/bash mailswiftsync:release-integration /usr/local/lib/mailswiftsync/imap-integration-smoke.sh
      - name: Run packaged native Dovecot engine fixture
        run: >-
          docker run --rm
          --env MAILSWIFTSYNC_TEST_ENGINE=Dovecot
          --entrypoint /bin/bash
          mailswiftsync:release-integration
          /usr/local/lib/mailswiftsync/imap-integration-smoke.sh
      - name: Run packaged controller recovery fixture
        run: docker run --rm --entrypoint /bin/bash mailswiftsync:release-integration /usr/local/lib/mailswiftsync/controller-recovery-smoke.sh
      - name: Run packaged controller storage-fault and corruption fixture
        run: docker run --rm --entrypoint /bin/bash mailswiftsync:release-integration /usr/local/lib/mailswiftsync/controller-chaos-smoke.sh
      - name: Run packaged engine-side destination storage-fault fixture
        run: docker run --rm --entrypoint /bin/bash mailswiftsync:release-integration /usr/local/lib/mailswiftsync/engine-storage-fault-smoke.sh

  native-runtime-tests:
    name: Release native runtime tests (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Assert the tested revision is the release tag SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          components: rustfmt, clippy
      - name: Initialize MSVC build environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Select the MSVC linker explicitly
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe'
          if (-not (Test-Path $linker)) { throw "Could not locate the x64 MSVC linker at $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run native test suite
        env:
          RUST_BACKTRACE: full
        shell: bash
        run: cargo test --locked --all-targets --all-features -- --test-threads=1 --nocapture

  publish:
    needs: [build, sbom, verify, packaged-integration, native-runtime-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: mailswiftsync-*
          merge-multiple: true
      - name: Create deterministic release manifest
        shell: bash
        run: |
          manifest=dist/mailswiftsync-release-manifest.txt
          find dist -maxdepth 1 -type f \
            ! -name '*.sha256' \
            ! -name 'mailswiftsync-release-manifest.txt' \
            -printf '%f\n' | sort | while read -r file; do
              sha256sum "dist/$file"
          done > "$manifest"
          (cd dist && sha256sum mailswiftsync-release-manifest.txt) \
            > dist/mailswiftsync-release-manifest.txt.sha256
      - name: Verify release checksums
        run: scripts/verify-release.sh dist
      - name: Attest release manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mailswiftsync-release-manifest.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
