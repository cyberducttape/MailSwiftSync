name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    name: Release quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: bash -n scripts/*.sh
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mailswiftsync
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mailswiftsync.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mailswiftsync
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: mailswiftsync
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --all-features --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/mailswiftsync-${{ matrix.target }}
          chmod 0755 dist/mailswiftsync-${{ matrix.target }}
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner -C dist -czf dist/mailswiftsync-${{ matrix.target }}.tar.gz mailswiftsync-${{ matrix.target }}
          (cd dist && shasum -a 256 mailswiftsync-${{ matrix.target }}.tar.gz) > dist/mailswiftsync-${{ matrix.target }}.tar.gz.sha256
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary }} dist/mailswiftsync-${{ matrix.target }}.exe
          Compress-Archive -Path dist/mailswiftsync-${{ matrix.target }}.exe -DestinationPath dist/mailswiftsync-${{ matrix.target }}.zip
          (Get-FileHash dist/mailswiftsync-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + '  ' + 'mailswiftsync-${{ matrix.target }}.zip' | Out-File dist/mailswiftsync-${{ matrix.target }}.zip.sha256 -Encoding ascii
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: mailswiftsync-${{ matrix.target }}
          path: dist/*

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
      - name: Generate SBOM from Cargo.lock
        run: |
          scripts/generate-sbom.sh dist/mailswiftsync-sbom.json
          (cd dist && sha256sum mailswiftsync-sbom.json) > dist/mailswiftsync-sbom.json.sha256
      - name: Attest SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mailswiftsync-sbom.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: mailswiftsync-sbom
          path: dist/mailswiftsync-sbom.json*

  publish:
    needs: [build, sbom, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: mailswiftsync-*
          merge-multiple: true
      - name: Verify release checksums
        run: scripts/verify-release.sh dist
      - uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
