name: Live provider smoke

# Manually dispatched smoke run against operator-owned disposable mailboxes:
# dry pilot, interruption + recovery into a
# separate destination mailbox, and a live pilot, using the packaged runtime
# image (pinned imapsync 2.314). It exchanges supplied refresh configurations
# for initial access tokens, then tests live transfer and recovery against real
# providers. The harness does not configure imapsync's per-reconnect refresh
# callback, so it does NOT prove mid-transfer token renewal or refresh-token
# rotation during reconnect. It is NOT release qualification: the smoke proofs
# it retains cannot satisfy scripts/verify-evidence-gate.sh.
#
# Secrets live in the `live-providers` environment. For hosted providers, each
# *_REFRESH_CONFIG is the JSON written by
#   mailswiftsync oauth-authorize ... <keyring-id>
#   mailswiftsync oauth-export-refresh-config <keyring-id> <file>
# Use dedicated test mailboxes only; the destination mailboxes are written to.
on:
  workflow_dispatch:
    inputs:
      direction:
        description: Provider pair to exercise
        required: true
        type: choice
        options:
          - gmail-to-microsoft365
          - microsoft365-to-gmail
          - cpanel-dovecot-to-cpanel-dovecot
      confirm_disposable_mailbox_writes:
        description: I confirm all configured mailboxes are disposable test accounts and destination writes are authorized
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Two runs against the same test mailboxes would interfere.
  group: live-provider-smoke
  cancel-in-progress: false

jobs:
  provider-smoke:
    name: Live provider smoke (${{ github.event.inputs.direction }})
    # This workflow receives live-provider credentials and executes the
    # Dockerfile plus harness from the dispatched ref. Only main-ref code may
    # cross that credential boundary; required main-branch CI checks apply.
    if: github.ref == 'refs/heads/main' && inputs.confirm_disposable_mailbox_writes
    runs-on: ubuntu-24.04
    environment: live-providers
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the distributed runtime image
        run: docker build --build-arg MAILSWIFTSYNC_GIT_SHA="${GITHUB_SHA}" --tag mailswiftsync:provider .
      - name: Stage OAuth refresh configurations
        env:
          DIRECTION: ${{ github.event.inputs.direction }}
          GOOGLE_PRIMARY_USER: ${{ secrets.GOOGLE_PRIMARY_USER }}
          GOOGLE_PRIMARY_REFRESH_CONFIG: ${{ secrets.GOOGLE_PRIMARY_REFRESH_CONFIG }}
          GOOGLE_RECOVERY_USER: ${{ secrets.GOOGLE_RECOVERY_USER }}
          GOOGLE_RECOVERY_REFRESH_CONFIG: ${{ secrets.GOOGLE_RECOVERY_REFRESH_CONFIG }}
          M365_PRIMARY_USER: ${{ secrets.M365_PRIMARY_USER }}
          M365_PRIMARY_REFRESH_CONFIG: ${{ secrets.M365_PRIMARY_REFRESH_CONFIG }}
          M365_RECOVERY_USER: ${{ secrets.M365_RECOVERY_USER }}
          M365_RECOVERY_REFRESH_CONFIG: ${{ secrets.M365_RECOVERY_REFRESH_CONFIG }}
          CPANEL_SOURCE_ENDPOINT: ${{ secrets.CPANEL_SOURCE_ENDPOINT }}
          CPANEL_SOURCE_USER: ${{ secrets.CPANEL_SOURCE_USER }}
          CPANEL_SOURCE_PASSWORD: ${{ secrets.CPANEL_SOURCE_PASSWORD }}
          CPANEL_DESTINATION_ENDPOINT: ${{ secrets.CPANEL_DESTINATION_ENDPOINT }}
          CPANEL_DESTINATION_USER: ${{ secrets.CPANEL_DESTINATION_USER }}
          CPANEL_DESTINATION_PASSWORD: ${{ secrets.CPANEL_DESTINATION_PASSWORD }}
          CPANEL_RECOVERY_ENDPOINT: ${{ secrets.CPANEL_RECOVERY_ENDPOINT }}
          CPANEL_RECOVERY_USER: ${{ secrets.CPANEL_RECOVERY_USER }}
          CPANEL_RECOVERY_PASSWORD: ${{ secrets.CPANEL_RECOVERY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          secrets="$RUNNER_TEMP/provider-secrets"
          mkdir -p "$secrets"
          case "$DIRECTION" in
            cpanel-dovecot-to-cpanel-dovecot)
              provider=cpanel_dovecot
              for role in source destination recovery; do
                role_upper="$(printf '%s' "$role" | tr '[:lower:]' '[:upper:]')"
                for field in ENDPOINT USER PASSWORD; do
                  var="CPANEL_${role_upper}_${field}"
                  if [[ -z "${!var:-}" ]]; then
                    echo "Missing secret ${var} in the live-providers environment" >&2
                    exit 1
                  fi
                done
              done
              for role in source destination recovery; do
                role_upper="$(printf '%s' "$role" | tr '[:lower:]' '[:upper:]')"
                endpoint_var="CPANEL_${role_upper}_ENDPOINT"
                user_var="CPANEL_${role_upper}_USER"
                password_var="CPANEL_${role_upper}_PASSWORD"
                printf '%s' "${!endpoint_var}" > "$secrets/${role}-endpoint"
                printf '%s' "${!user_var}" > "$secrets/${role}-user"
                printf '%s' "${!password_var}" > "$secrets/${role}-password"
              done
              source_endpoint=; dest_endpoint= ;;
            gmail-to-microsoft365)
              provider=gmail
              source_prefix=GOOGLE_PRIMARY; source_endpoint=imap.gmail.com:993
              dest_prefix=M365_PRIMARY; dest_endpoint=outlook.office365.com:993
              recovery_prefix=M365_RECOVERY ;;
            microsoft365-to-gmail)
              provider=m365
              source_prefix=M365_PRIMARY; source_endpoint=outlook.office365.com:993
              dest_prefix=GOOGLE_PRIMARY; dest_endpoint=imap.gmail.com:993
              recovery_prefix=GOOGLE_RECOVERY ;;
            *) echo "Unknown direction: $DIRECTION" >&2; exit 2 ;;
          esac
          if [[ "$DIRECTION" != cpanel-dovecot-to-cpanel-dovecot ]]; then
            for role in source dest recovery; do
              prefix_var="${role}_prefix"; prefix="${!prefix_var}"
              user_var="${prefix}_USER"; config_var="${prefix}_REFRESH_CONFIG"
              if [[ -z "${!user_var:-}" || -z "${!config_var:-}" ]]; then
                echo "Missing secret ${user_var} or ${config_var} in the live-providers environment" >&2
                exit 1
              fi
              printf '%s' "${!config_var}" > "$secrets/${role}-refresh.json"
              printf '%s\n' "${!user_var}" > "$secrets/${role}-user"
            done
          fi
          {
            printf 'provider=%s\n' "$provider"
            printf 'source_endpoint=%s\n' "$source_endpoint"
            printf 'dest_endpoint=%s\n' "$dest_endpoint"
          } > "$secrets/pair.env"
          mkdir -p provider-smoke-evidence
          # The packaged runtime owns UID 10001; keep OAuth/password files and
          # exported evidence inaccessible to container root and unrelated users.
          sudo chown -R 10001:10001 "$secrets" provider-smoke-evidence
      - name: Run provider smoke harness in the packaged image
        run: |
          set -euo pipefail
          docker run --rm --user 10001:10001 \
            --volume "$PWD:/work:ro" \
            --volume "$RUNNER_TEMP/provider-secrets:/secrets" \
            --volume "$PWD/provider-smoke-evidence:/evidence" \
            --entrypoint /bin/bash mailswiftsync:provider -euo pipefail -c '
              source /secrets/pair.env
              export MAILSWIFTSYNC_PROVIDER_BINARY=/usr/local/bin/mailswiftsync
              if [ "$provider" = cpanel_dovecot ]; then
                export MAILSWIFTSYNC_SOURCE_PROVIDER=cpanel_dovecot
                export MAILSWIFTSYNC_DESTINATION_PROVIDER=cpanel_dovecot
                export MAILSWIFTSYNC_PROVIDER_SOURCE_ENDPOINT="$(cat /secrets/source-endpoint)"
                export MAILSWIFTSYNC_PROVIDER_SOURCE_USER="$(cat /secrets/source-user)"
                export MAILSWIFTSYNC_PROVIDER_SOURCE_SECRET=/secrets/source-password
                export MAILSWIFTSYNC_PROVIDER_DEST_ENDPOINT="$(cat /secrets/destination-endpoint)"
                export MAILSWIFTSYNC_PROVIDER_DEST_USER="$(cat /secrets/destination-user)"
                export MAILSWIFTSYNC_PROVIDER_DEST_SECRET=/secrets/destination-password
                export MAILSWIFTSYNC_PROVIDER_RECOVERY_DEST_ENDPOINT="$(cat /secrets/recovery-endpoint)"
                export MAILSWIFTSYNC_PROVIDER_RECOVERY_DEST_USER="$(cat /secrets/recovery-user)"
                export MAILSWIFTSYNC_PROVIDER_RECOVERY_DEST_SECRET=/secrets/recovery-password
              else
                # Exchange refresh configurations through the product client;
                # access tokens are written to owner-only files, never printed.
                for role in source dest recovery; do
                  mailswiftsync oauth-access-token \
                    "/secrets/${role}-refresh.json" "/secrets/${role}-token"
                done
                export MAILSWIFTSYNC_PROVIDER_SOURCE_ENDPOINT="$source_endpoint"
                export MAILSWIFTSYNC_PROVIDER_SOURCE_USER="$(cat /secrets/source-user)"
                export MAILSWIFTSYNC_PROVIDER_SOURCE_SECRET=/secrets/source-token
                export MAILSWIFTSYNC_PROVIDER_DEST_ENDPOINT="$dest_endpoint"
                export MAILSWIFTSYNC_PROVIDER_DEST_USER="$(cat /secrets/dest-user)"
                export MAILSWIFTSYNC_PROVIDER_DEST_SECRET=/secrets/dest-token
                export MAILSWIFTSYNC_PROVIDER_RECOVERY_DEST_ENDPOINT="$dest_endpoint"
                export MAILSWIFTSYNC_PROVIDER_RECOVERY_DEST_USER="$(cat /secrets/recovery-user)"
                export MAILSWIFTSYNC_PROVIDER_RECOVERY_DEST_SECRET=/secrets/recovery-token
              fi
              export MAILSWIFTSYNC_EVIDENCE_OUTPUT=/evidence
              bash /work/scripts/provider-integration-test.sh "$provider"
            '
      - name: Remove staged credentials
        if: always()
        run: sudo rm -rf "$RUNNER_TEMP/provider-secrets"
      - name: Restore artifact ownership for upload
        if: always()
        run: |
          if [ -d provider-smoke-evidence ]; then
            sudo chown -R "$(id -u):$(id -g)" provider-smoke-evidence
            chmod -R u+rwX,go-rwx provider-smoke-evidence
          fi
      - name: Upload smoke proofs (credential-free)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-provider-smoke-${{ github.event.inputs.direction }}
          path: provider-smoke-evidence
          retention-days: 14
          if-no-files-found: warn
