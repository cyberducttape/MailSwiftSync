name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master # revision locked by actions.lock
        with:
          toolchain: 1.92.0
      - uses: github/codeql-action/init@v4.31.9
        with:
          languages: actions,python,rust
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4.31.9
        with:
          category: "/language:all"
          upload: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
