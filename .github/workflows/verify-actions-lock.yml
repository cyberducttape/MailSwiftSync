name: Verify workflow action lock

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/CODEOWNERS"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/CODEOWNERS"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify locked action dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned gh-actions-lock extension
        run: gh extension install github/gh-actions-lock --pin 759f9c2d44e8599fa5b29224e5a30c58b3555211
      - name: Verify action dependency lockfile
        run: gh actions-lock --verify
