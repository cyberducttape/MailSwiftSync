name: IMAP integration lab

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  packaged-imapsync-transfer:
    name: Packaged imapsync product integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the distributed runtime image
        run: docker build --build-arg MAILSWIFTSYNC_GIT_SHA="${GITHUB_SHA}" --tag mailswiftsync:integration .
      - name: Run disposable real-server transfer
        run: |
          mkdir -p provider-evidence
          docker run --rm \
            --volume "$PWD/provider-evidence:/provider-evidence" \
            --env MAILSWIFTSYNC_EVIDENCE_OUTPUT=/provider-evidence \
            --entrypoint /bin/bash mailswiftsync:integration \
            /usr/local/lib/mailswiftsync/imap-integration-smoke.sh
          run_id=$(python3 - provider-evidence/customer-proof.json <<'PY'
          import json, sys
          proof = json.load(open(sys.argv[1], encoding="utf-8"))
          runs = [run for run in proof["runs"] if run.get("status") == "completed"]
          print(max(runs, key=lambda run: (run["started_at"], run["run_id"]))["run_id"])
          PY
          )
          mailswiftsync_version=$(docker run --rm mailswiftsync:integration --version | sed -n 's/^MailSwiftSync \([^ ]*\).*/\1/p')
          mailswiftsync_commit=$(docker run --rm mailswiftsync:integration --version | sed -n 's/.*(git \([^)]*\)).*/\1/p')
          mailswiftsync_sha=$(docker run --rm --entrypoint /bin/bash mailswiftsync:integration -c 'sha256sum /usr/local/bin/mailswiftsync' | awk '{print $1}')
          imapsync_version=$(docker run --rm --entrypoint /bin/bash mailswiftsync:integration -c 'imapsync --version 2>&1' | sed -n -e 's/.*imapsync[[:space:]]\+\([0-9][0-9.]*\).*/\1/p' -e 's/^[[:space:]]*v\?\([0-9][0-9.]*\)[[:space:]]*$/\1/p' | head -1)
          imapsync_sha=$(docker run --rm --entrypoint /bin/bash mailswiftsync:integration -c 'sha256sum "$(command -v imapsync)"' | awk '{print $1}')
          qualification_bundle_id="generic-imap-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA}"
          python3 scripts/generate-provider-evidence.py \
            provider-evidence/customer-proof.json generic_imap generic_imap live_pilot \
            --run-id "$run_id" --engine-version "$imapsync_version" \
            --mailswiftsync-version "$mailswiftsync_version" \
            --mailswiftsync-commit "$mailswiftsync_commit" \
            --mailswiftsync-binary-sha256 "$mailswiftsync_sha" \
            --imapsync-binary-sha256 "$imapsync_sha" \
            --qualification-bundle-id "$qualification_bundle_id" \
            --output provider-evidence/generic_imap-to-generic_imap-live_pilot.json
      - name: Run controller crash and recovery lab
        run: docker run --rm --entrypoint /bin/bash mailswiftsync:integration /usr/local/lib/mailswiftsync/controller-recovery-smoke.sh
      - name: Run controller storage-fault and corruption lab
        run: docker run --rm --entrypoint /bin/bash mailswiftsync:integration /usr/local/lib/mailswiftsync/controller-chaos-smoke.sh
      - name: Run engine-side destination storage-fault lab
        run: docker run --rm --entrypoint /bin/bash mailswiftsync:integration /usr/local/lib/mailswiftsync/engine-storage-fault-smoke.sh
      - name: Upload generated customer-proof and provider evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imap-integration-evidence
          path: provider-evidence
          if-no-files-found: warn

  native-dovecot-transfer:
    name: Native Dovecot engine integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the distributed runtime image
        run: docker build --build-arg MAILSWIFTSYNC_GIT_SHA="${GITHUB_SHA}" --tag mailswiftsync:dovecot-integration .
      - name: Run native doveadm transfer, preflight, and verification
        run: >-
          docker run --rm
          --env MAILSWIFTSYNC_TEST_ENGINE=Dovecot
          --entrypoint /bin/bash
          mailswiftsync:dovecot-integration
          /usr/local/lib/mailswiftsync/imap-integration-smoke.sh
