[package]
name = "mailswiftsync-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
csv = "1.3"
libfuzzer-sys = "0.4"
sha2 = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
url = "2.5"
zeroize = "1.8"

[[bin]]
name = "fetch_response"
path = "fuzz_targets/fetch_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "list_response"
path = "fuzz_targets/list_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "literal_framing"
path = "fuzz_targets/literal_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "namespace_response"
path = "fuzz_targets/namespace_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "provider_error"
path = "fuzz_targets/provider_error.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extra_options"
path = "fuzz_targets/extra_options.rs"
test = false
doc = false
bench = false

[[bin]]
name = "oauth_redirect"
path = "fuzz_targets/oauth_redirect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "migration_snapshot"
path = "fuzz_targets/migration_snapshot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recovery_state"
path = "fuzz_targets/recovery_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "migration_plan"
path = "fuzz_targets/migration_plan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xlsx_dimension"
path = "fuzz_targets/xlsx_dimension.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_rows"
path = "fuzz_targets/import_rows.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
