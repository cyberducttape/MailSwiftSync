[package]
name = "mailswiftsync"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.33"
rfd = "0.15"
dirs-next = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1.3"
calamine = "0.36"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
libc = "0.2"
