[package]
name = "mailswiftsync"
version = "0.1.0"
edition = "2024"
description = "Local-first mailbox migration workbench for planning, execution, verification, and audit"
license = "MIT"
repository = "https://github.com/cyberducttape/MailSwiftSync"
readme = "README.md"
keywords = ["imap", "email", "migration", "dovecot", "imapsync"]
categories = ["command-line-utilities", "gui", "network-programming"]

[dependencies]
base64 = "0.22"
eframe = "0.35"
egui_extras = "0.35"
rfd = "0.15"
dirs-next = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1.3"
calamine = "0.36"
keyring = "4.2"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
webpki-roots = "1.0"
libc = "0.2"
fs2 = "0.4"
crossbeam-channel = "0.5"
crc32fast = "1.5"
sha2 = "0.10"
zeroize = "1.8"
zip = { version = "8.6", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_SystemServices",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
