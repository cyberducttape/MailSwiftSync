[package]
name = "mailswiftsync"
version = "0.1.0"
edition = "2024"
description = "Local-first mailbox migration workbench for planning, execution, verification, and audit"
license = "MIT"
repository = "https://github.com/itchyitchy123/MailSwiftSync"
readme = "README.md"
keywords = ["imap", "email", "migration", "dovecot", "imapsync"]
categories = ["command-line-utilities", "gui", "network-programming"]

[dependencies]
eframe = "0.33"
rfd = "0.15"
dirs-next = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1.3"
calamine = "0.36"
keyring = "4.2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
libc = "0.2"
fs2 = "0.4"
crossbeam-channel = "0.5"
sha2 = "0.10"
zeroize = "1.8"
