# Supply-chain policy for the scheduled dependency audit.

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # Calamine 0.36.1 currently requires zip ^8.6; zip 8.6.0 is the only
    # compatible published version and is yanked. Remove this exception as
    # soon as Calamine releases a compatible non-yanked dependency.
    { crate = "zip@8.6.0", reason = "Required by calamine 0.36.1; bounded XLSX prevalidation precedes parser use." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSL-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
