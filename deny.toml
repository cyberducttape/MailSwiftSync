# Supply-chain policy for the scheduled dependency audit.

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 is currently required by the Linux accessibility and Secret Service backends; review this exception when updating the desktop/keyring dependency graph" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 is currently required by the Linux accessibility and Secret Service backends; review this exception when updating the desktop/keyring dependency graph" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 is currently required by zvariant 5 in the Linux accessibility and Secret Service backends; review this exception when updating the desktop/keyring dependency graph" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSL-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
