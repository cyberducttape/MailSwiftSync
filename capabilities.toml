# Release-facing feature status. Keep implementation state separate from live
# qualification state so documentation cannot turn a unit test into a support
# claim.
[[production_features]]
feature = "Pre/post-migration reports"
status = "implemented"
evidence = "Explicit report views and durable snapshot exports are wired; automatic post-run generation is not claimed."

[[production_features]]
feature = "Resume/recovery dashboard"
status = "implemented"
evidence = "Recovery workspace and durable recovery guidance are wired; autonomous resume remains operator-controlled."

[[production_features]]
feature = "Provider error classification"
status = "implemented"
evidence = "Provider identity is enforced at the execution boundary; documented provider signatures are scoped to the selected provider while RFC IMAP response codes remain universal. Live provider qualification remains pending."

[[production_features]]
feature = "Shared durable batch plans"
status = "implemented"
evidence = "Schema v21 stores one normalized batch plan per distinct policy plus mailbox identity/credential deltas and an approval-gated cutover workflow, alongside the durable webhook outbox and transaction-bound lifecycle event trigger."

[[production_features]]
feature = "Run-level batch throttle policy"
status = "implemented"
evidence = "Current concurrency and throughput settings are snapshotted, confirmed, and applied when rebuilding durable mailbox rows."

[[production_features]]
feature = "Adaptive launch and worker ceilings"
status = "implemented"
evidence = "Global launch and worker ceilings are configurable with conservative bounds; launch pressure halves on observed capacity failures and recovers additively under the configured ceiling, while provider and tenant rate domains adapt from observed signals."

[[production_features]]
feature = "Provider qualification packs"
status = "planned"
evidence = "Qualification evidence schema and procedures exist, but bundled live provider-pair packs are not present."

[[production_features]]
feature = "Signed migration certificate"
status = "implemented"
evidence = "The certificate command exports only durably completed customer evidence and atomically publishes an Ed25519-signed certificate; the artifact explicitly remains an authenticated ledger claim rather than independent message-level attestation."

[[production_features]]
feature = "Migration simulation"
status = "partial"
evidence = "Plan risk assessment now shows observed source/destination quota facts, RFC 7889 APPENDLIMIT maximum-message facts, and explicit unknown-capacity states; provider-specific folder-limit and complete destination-capacity simulation is not yet guaranteed."

[[production_features]]
feature = "Automatic destination capacity checks"
status = "partial"
evidence = "Quota parsing, RFC 7889 APPENDLIMIT observation, explicit unknown-capacity warnings, and destination quota blocking exist where IMAP data is exposed; provider-wide capacity discovery is not qualified."

[[production_features]]
feature = "Advanced typed folder mapping"
status = "partial"
evidence = "The advanced plan editor now supports bounded exact source-to-destination mappings and source-folder exclusions; rules are immutable plan state, emitted as imapsync --f1f2/anchored --exclude arguments, and reused by independent verification. Arbitrary regex transforms remain unsupported."

[[production_features]]
feature = "Executable cutover orchestration"
status = "partial"
evidence = "Durable approval-gated Seed, Catch-up, Final Delta, and Verification stages are executable through the cutover CLI with persisted schedule/window enforcement; external MX/DNS confirmation remains an explicit operator acknowledgement."

[[production_features]]
feature = "Organization policy enforcement"
status = "partial"
evidence = "Owner-only organization-policy.toml enforcement covers TLS, destination mutation, minimum verification, and concurrency at preflight/batch admission; provider-tenant quotas and role-scoped policy administration remain open."

[[production_features]]
feature = "Durable signed webhook delivery"
status = "partial"
evidence = "HTTPS webhook delivery now has deterministic event IDs, idempotency headers, optional HMAC signatures, transaction-bound lifecycle event production, and a SQLite outbox with bounded retry/backoff/dead-letter state; notify-webhook --watch provides continuous operator-managed delivery while fleet-centralized management remains open."

[documentation]
# Terms that must appear only under README's experimental/planned status
# section. This keeps the machine-readable capability boundary authoritative
# for the human-facing status layout.
experimental_only_terms = ["native dovecot execution"]

# Operator-facing verification tiers. This is the single vocabulary for
# evidence levels: scripts/verify-capability-claims.py regenerates README's
# level table from it and rejects any "Level N" in current docs, Rust labels,
# or locale strings whose number, name, or limitation is not defined here.
# `methods` are the `VerificationMethod` variants that src/core/evidence.rs
# maps to the level; `aliases` are accepted shorter UI names.
[[verification_levels]]
level = 1
name = "Aggregate evidence"
limit = "individual messages not compared"
compares = "Folder/message/byte totals and engine-reported counters."
methods = ["AggregateEngine", "NativeDovecot"]
aliases = []

[[verification_levels]]
level = 2
name = "Per-message metadata reconciliation"
limit = "bodies not compared"
compares = "Message-ID, INTERNALDATE, and RFC822.SIZE, fetched independently from both sides."
methods = ["MetadataReconciliation"]
aliases = ["Message metadata reconciliation", "message metadata"]

[[verification_levels]]
level = 3
name = "Bounded content fingerprints"
limit = "not full byte-for-byte proof"
compares = "SHA-256 fingerprints of bounded RFC822 body content on both sides (explicit forensic mode)."
methods = ["BodyHash"]
aliases = []

# A capability's optional `manifest_rows` names the CAPABILITY_MANIFEST.md
# table rows that describe it. scripts/verify-capability-claims.py checks
# each named row's Code, Wired, and Live Provider cells against these
# fields, and regenerates the manifest's machine-readable status table.

[capabilities.aggregate_evidence]
code = "implemented"
